monitor=,preferred,auto,1

# AUTO START
# ============================================
exec-once = sh -c "nohup caelestia-shell > ~/.local/state/caelestia-shell.log 2>&1 &"
exec-once = nm-applet --indicator
exec-once = hypridle


exec-once = swww init

layerrule = blur, hyprlock
layerrule = ignorezero, hyprlock


# ==================================================
# VARIABLES
# ==================================================

$terminal = kitty
$fileManager = dolphin
$menu = fuzzel


# ==================================================
# ENV
# ==================================================
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24


env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland


# ==================================================
# GENERAL
# ==================================================

general {
    gaps_in = 6
    gaps_out = 12

    border_size = 2
    col.active_border = rgba(aaaaaaff)
    col.inactive_border = rgba(444444aa)

    resize_on_border = true
    layout = dwindle
}


# ==================================================
# DECORATION
# ==================================================

decoration {
    rounding = 14
    active_opacity = 0.88
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.0
    }
}


# ==================================================
# ANIMATIONS
# ==================================================

animations {
    enabled = yes
    animation = windows, 1, 7, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}


# ==================================================
# DWINDLE
# ==================================================

dwindle {
    pseudotile = true
    preserve_split = true
}


# ==================================================
# MISC
# ==================================================

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


# ==================================================
# INPUT
# ==================================================

input {
    kb_layout = latam
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}


# ==================================================
# KEYBINDS
# ==================================================

bind = SUPER, RETURN, exec, $terminal

# Fuzzel launcher

bind = SUPER, D, exec, $menu

bind = SUPER, E, exec, dolphin

bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating


bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d


bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d


# Workspaces

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6


bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6


# ==================================================
# SCREENSHOT
# ==================================================

bind = SUPER, S, exec, ~/.config/hypr/scripts/screenshot.sh
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot.sh


# ==================================================
# AUDIO
# ==================================================

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ==================================================
# WINDOW RULES
# ==================================================

windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$


# ==================================================
# THEMES
# ==================================================

bind = SUPER, F1, exec, ~/.config/hyprq/scripts/theme.sh light
bind = SUPER, F2, exec, ~/.config/hypr/scripts/theme.sh dark


bind = SUPER, L, exec, quickshell -p /nix/store/jl9nf14cvh6h5qk7rql2d72cvpqhi4k8-caelestia-shell-1.0.0/share/caelestia-shell ipc call lock lock

bind = SUPER, W, exec, ~/.config/hypr/scripts/wallpaper.sh

bind = SUPER, R, exec, swaync-client -t

bind = SUPER, B, exec, blueman-manager

bind = SUPER, X, exec, ~/.config/rofi/powermenu.sh

bind = SUPER, T, exec, fish -c waybar-theme

bind = SUPER, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy